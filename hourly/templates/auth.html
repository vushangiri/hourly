<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="{{ csrf }}"><title>Sign in · hourly.</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/auth.js"></script></head><body><main class="shell auth"><div class="content"><div class="row"><div class="logo">◷</div><div class="brand">hourly.</div></div><h1 class="title" id="heading">Welcome back.</h1><p class="muted">Your hours, simplified.</p><form id="authform"><input type="hidden" name="mode" id="mode" value="login"><div id="registration" class="hidden"><div class="field"><label for="name">Full name</label><input id="name" name="name" maxlength="120" autocomplete="name"></div><div class="field"><label for="phone">Phone with country code</label><input id="phone" name="phone" type="tel" placeholder="+61412345678" autocomplete="tel"></div><div class="field"><label for="timezone">Timezone</label><input id="timezone" name="timezone" value="Australia/Sydney"></div></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field" id="passwordfield"><label for="password">Password (12–128 characters)</label><input id="password" name="password" type="password" minlength="12" maxlength="128" required autocomplete="current-password"></div><div id="error" class="error" role="alert"></div><div class="gap"></div><button class="btn primary" id="submit">Sign in</button></form><div class="authlinks"><button class="inline" data-mode="register">Create account</button><button class="inline" data-mode="forgot">Forgot password?</button><button class="inline hidden" data-mode="login">Sign in</button></div><p id="message" role="status"></p></div></main></body></html>
