<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145c44"><title>hourly. — Approved UI Reference</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2923;background:#e8eeea;font-synthesis:none}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #46a985;outline-offset:2px}body{margin:0}.shell{max-width:430px;margin:20px auto;background:#fbfcfa;min-height:95vh;border-radius:25px;overflow:hidden;box-shadow:0 15px 55px #14271d16;display:flex;flex-direction:column}.content{padding:20px;flex:1}.top,.between,.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.logo{display:grid;place-items:center;background:#167c5b;color:white;width:38px;height:38px;border-radius:12px;font-size:23px}.muted{color:#738079}.small{font-size:12px}.eyebrow{font-size:10px;letter-spacing:1.1px;font-weight:700}.title{font-size:25px;letter-spacing:-.9px;font-weight:750;margin:5px 0 16px}.section{font-size:15px;font-weight:750}.spacer{height:19px}.btn{border:1px solid #e0e7e0;border-radius:12px;background:white;color:inherit;padding:11px 14px;font-weight:650;transition:transform .14s,background .14s}.btn:active,.entry:active{transform:scale(.985)}.primary{background:#177c5b;color:white;border-color:#177c5b;width:100%;padding:14px}.iconbtn{padding:9px 12px}.select{width:100%;background:white;color:inherit;border:1px solid #e0e7e0;border-radius:12px;padding:12px;min-width:0}.workpick{display:flex;gap:8px}.workpick select{flex:1}.segments{display:grid;grid-template-columns:repeat(3,1fr);background:#eef1ed;padding:4px;border-radius:13px;gap:3px}.segments button{border:0;background:transparent;border-radius:9px;padding:10px 4px;color:#6a786f;font-weight:650}.segments button.active{background:white;color:#183c2b;box-shadow:0 2px 7px #0000000c}.navperiod{display:flex;justify-content:space-between;align-items:center;text-align:center;margin:15px 0}.navperiod button{border:0;background:transparent;font-size:23px;padding:4px 12px;color:inherit}.hero{background:#145c44;color:white;border-radius:19px;padding:20px}.hero .muted{color:#c8e3d3}.money{font-size:33px;letter-spacing:-1px;font-weight:800;margin:13px 0}.hero hr{border:0;border-top:1px solid #47826a;margin:15px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats strong{display:block;margin-top:5px;font-size:19px}.pill{display:inline-block;background:#31735b;color:white;border-radius:20px;padding:5px 10px;font-size:11px;margin-top:14px;margin-right:5px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#6b786e;margin:13px 0}.entries{display:grid;gap:8px}.entry{width:100%;text-align:left;border:1px solid #e4ebe5;border-radius:14px;background:white;padding:12px;display:flex;align-items:center;gap:12px;color:inherit;transition:transform .14s,background .14s}.entry.auto{background:#fff8eb;border-color:#eedab8}.datebox{width:45px;text-align:center;flex:none}.datebox strong{display:block;font-size:20px}.entrymain{flex:1;min-width:0}.entrymain strong{display:block;font-size:14px}.entrymain small{display:block;margin-top:4px;color:#758078;font-size:11px}.entry.auto small{color:#a46b23}.entryright{text-align:right}.entryright strong{display:block}.entryright small{font-size:11px;color:#758078}.bottom{display:grid;grid-template-columns:repeat(3,1fr);background:white;border-top:1px solid #e5eae5;padding:10px 8px max(16px,env(safe-area-inset-bottom))}.bottom button{background:none;border:0;color:#79847d;padding:8px 2px;font-size:11px}.bottom button span{display:block;font-size:20px;margin-bottom:4px}.bottom button.active{color:#16825d;font-weight:750}.card{border:1px solid #e4ebe5;background:white;border-radius:15px;padding:15px;margin-bottom:12px}.card h3{margin:0 0 13px}.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}.cardgrid span{display:block;color:#7b857e;font-size:11px;margin-bottom:4px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:13px}.weekday{border:0;border-radius:9px;padding:9px 0;background:#edf1ed;color:#758078;font-size:11px;font-weight:700}.weekday.active{background:#ddefe3;color:#146549}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:12px;font-weight:700}.field input,.field select{width:100%;border:1px solid #dfe7df;border-radius:10px;padding:11px;background:white;color:#1c2923}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px;border-radius:12px;background:#eff4ef}.toggle input{width:20px;height:20px;accent-color:#187b5b}.overlay{position:fixed;inset:0;background:#07150cb0;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modal{width:min(430px,100%);max-height:90vh;overflow:auto;border-radius:22px;background:#fbfcfa;padding:20px;box-shadow:0 10px 45px #0003}.error{color:#b13232;font-size:12px;min-height:15px}.hidden{display:none!important}.empty{text-align:center;padding:20px;color:#7b857e}.dark{background:#14211b;color:#e6f0e9}.dark .btn,.dark .select,.dark .entry,.dark .card,.dark .bottom,.dark .field input,.dark .field select{background:#223129;border-color:#35473b;color:#e6f0e9}.dark .segments,.dark .weekday,.dark .toggle{background:#29382e}.dark .segments button.active{background:#375543;color:white}.dark .entry.auto{background:#322e23;border-color:#685435}.dark .weekday.active{background:#255940;color:#c5f1d9}.dark .bottom{border-color:#35473b}.dark .muted{color:#a5b4aa}.dark .hero .muted{color:#c8e3d3}.dark .modal{background:#14211b;color:#e6f0e9}.dark .field input,.dark .field select{color-scheme:dark}.dark .entrymain small,.dark .entryright small{color:#a5b4aa}.dark .entry.auto small{color:#e6bb78}@media(max-width:460px){body{background:#fbfcfa}.shell{margin:0;border-radius:0;min-height:100dvh;box-shadow:none}.content{padding:18px}}
</style></head><body><main id="shell" class="shell"><div class="content"><header class="between"><div class="row"><div class="logo">◷</div><div><div class="brand">hourly.</div><div class="eyebrow muted">WORK & PAY TRACKER</div></div></div><div class="row"><button class="btn iconbtn" id="theme" aria-label="Toggle dark mode">☾</button><button class="btn iconbtn" id="profile" aria-label="Edit profile">BG</button></div></header><div class="spacer"></div><section id="view"></section></div><nav class="bottom" aria-label="Main navigation"><button data-tab="Home" class="active"><span>⌂</span>Home</button><button data-tab="Workplaces"><span>▣</span>Workplaces</button><button data-tab="Settings"><span>⚙</span>Settings</button></nav></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div><script>
// Standalone interactive design reference. Not a backend or production PWA.
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const DEMO_TODAY=new Date(2026,10,1);const initial=[{id:'car',name:'Car Wash',rate:25,start:'07:30',end:'17:00',breaks:30,weekStart:2,workdays:[0,1,2,3,4,5],auto:true,pay:'Weekly'},{id:'cafe',name:'Cafe',rate:28,start:'16:00',end:'22:00',breaks:0,weekStart:0,workdays:[3,4,5,6],auto:false,pay:'Fortnightly'}];let orgs=structuredClone(initial),entries={},selected='car',period='Week',offset=0,tab='Home',dark=false,showAuto=true,profile={name:'Demo User',phone:'',email:''},editing=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const day=d=>(d.getDay()+6)%7;const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const fmt=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);const duration=(s,e,b)=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(s)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(e))return null;let [a,z]=s.split(':').map(Number),[c,d]=e.split(':').map(Number);let m=(c*60+d-a*60-z+1440)%1440||1440;return Number.isFinite(+b)&&+b>=0&&+b<m?(m-(+b))/60:null};const org=()=>orgs.find(o=>o.id===selected)||orgs[0];function range(){const o=org(),week=add(DEMO_TODAY,-((day(DEMO_TODAY)-o.weekStart+7)%7));let start,end;if(period==='Month'){start=new Date(2026,10+offset,1);end=new Date(start.getFullYear(),start.getMonth()+1,0)}else{start=add(week,offset*(period==='Week'?7:14));end=add(start,period==='Week'?6:13)}let dates=[];for(let d=new Date(start);d<=end;d=add(d,1))dates.push(d);return {start,end,dates}}function shift(o,d){const override=entries[o.id+':'+key(d)];if(override)return override;if(!o.workdays.includes(day(d)))return null;const hours=duration(o.start,o.end,o.breaks)||0;const [h,m]=o.end.split(':').map(Number);const endAt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);if(o.end<=o.start)endAt.setDate(endAt.getDate()+1);return {start:o.start,end:o.end,breaks:o.breaks,hours,status:o.auto&&endAt<=DEMO_TODAY?'auto':'planned'}}function render(){const o=org(),r=range();$('#shell').classList.toggle('dark',dark);document.body.style.background=dark?'#0c1411':'#e8eeea';$('#theme').textContent=dark?'☀':'☾';$('#profile').textContent=profile.name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'U';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='Home'){const shifts=r.dates.map(date=>({date,shift:shift(o,date)})),recorded=shifts.filter(s=>s.shift&&['auto','manual'].includes(s.shift.status)),hours=recorded.reduce((n,s)=>n+s.shift.hours,0);$('#view').innerHTML=`<div class="eyebrow muted">SUNDAY, 1 NOVEMBER 2026 · DEMO</div><h1 class="title">Your hours, simplified.</h1><div class="workpick"><select id="orgpick" class="select">${orgs.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn iconbtn" id="quicksettings" aria-label="Workplace settings">⚙</button></div><div class="spacer"></div><div class="segments">${['Week','Fortnight','Month'].map(x=>`<button data-period="${x}" class="${x===period?'active':''}">${x}</button>`).join('')}</div><div class="navperiod"><button id="prev" aria-label="Previous period">‹</button><div><strong>${fmt(r.start)} – ${fmt(r.end)}</strong><div class="small muted">${period==='Month'?'Calendar month':'Workweek begins '+DAYS[o.weekStart]}</div></div><button id="next" aria-label="Next period">›</button></div><div class="hero"><div class="between"><span class="small muted">Estimated gross earnings</span><span>▣</span></div><div class="money">${money(hours*o.rate)}</div><hr><div class="stats"><div><span class="small muted">Recorded hours</span><strong>${hours.toFixed(1)} hrs</strong></div><div><span class="small muted">Hourly rate</span><strong>${money(o.rate)}/hr</strong></div></div><span class="pill">${recorded.filter(x=>x.shift.status==='manual').length} manual</span><span class="pill">${recorded.filter(x=>x.shift.status==='auto').length} auto-set</span></div><div class="spacer"></div><div class="between"><div><div class="section">Daily timesheet</div><div class="small muted">Tap any day to log or edit</div></div><label class="small muted">Show auto <input type="checkbox" id="showauto" ${showAuto?'checked':''}></label></div><div class="legend"><span>✓ Manual</span><span>✦ Auto-set</span><span>◷ Planned</span></div><div class="entries">${shifts.filter(s=>showAuto||s.shift?.status!=='auto').map(s=>`<button class="entry ${s.shift?.status==='auto'?'auto':''}" data-shift="${key(s.date)}"><div class="datebox"><span class="small muted">${DAYS[day(s.date)].slice(0,3)}</span><strong>${s.date.getDate()}</strong></div><div class="entrymain"><strong>${s.shift&&s.shift.status!=='off'?`${esc(s.shift.start)} – ${esc(s.shift.end)}`:'Day off'}</strong><small>${s.shift?.status==='auto'?'✦ Automatically logged':s.shift?.status==='manual'?'✓ Manually logged':s.shift?.status==='planned'?'◷ Scheduled · Not logged':'No recorded shift'}</small></div><div class="entryright"><strong>${s.shift&&s.shift.status!=='off'?s.shift.hours.toFixed(1)+'h':'—'}</strong><small>${s.shift&&['auto','manual'].includes(s.shift.status)?money(s.shift.hours*o.rate):''}</small></div><span class="muted">›</span></button>`).join('')}</div><div class="spacer"></div><button class="btn primary" id="logtoday">＋ Log today's shift</button>`;$('#orgpick').onchange=e=>{selected=e.target.value;offset=0;render()};$('#quicksettings').onclick=()=>openOrg(o);document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;offset=0;render()});$('#prev').onclick=()=>{offset--;render()};$('#next').onclick=()=>{offset++;render()};$('#showauto').onchange=e=>{showAuto=e.target.checked;render()};document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>openShift(new Date(b.dataset.shift+'T12:00:00')));$('#logtoday').onclick=()=>openShift(DEMO_TODAY)}else if(tab==='Workplaces'){$('#view').innerHTML=`<div class="between"><h1 class="title">My workplaces</h1><span class="small muted">${orgs.length} / 3</span></div><p class="small muted">Independent schedules, rates and workweeks for every workplace.</p>${orgs.map(o=>`<article class="card"><div class="between"><h3>▣ ${esc(o.name)}</h3><button class="btn" data-editorg="${esc(o.id)}">Edit</button></div><div class="cardgrid"><div><span>Hourly rate</span><b>${money(o.rate)}/hr</b></div><div><span>Pay cycle</span><b>${esc(o.pay)}</b></div><div><span>Week begins</span><b>${DAYS[o.weekStart]}</b></div><div><span>Auto logging</span><b>${o.auto?'On':'Off'}</b></div></div><div class="weekdays">${DAYS.map((d,i)=>`<div class="weekday ${o.workdays.includes(i)?'active':''}" style="text-align:center">${d.slice(0,2)}</div>`).join('')}</div><div class="spacer"></div><button class="btn primary" data-vieworg="${esc(o.id)}">View timesheet</button></article>`).join('')}${orgs.length<3?'<button class="btn primary" id="addorg">＋ Add workplace</button>':''}`;document.querySelectorAll('[data-editorg]').forEach(b=>b.onclick=()=>openOrg(orgs.find(o=>o.id===b.dataset.editorg)));document.querySelectorAll('[data-vieworg]').forEach(b=>b.onclick=()=>{selected=b.dataset.vieworg;tab='Home';offset=0;render()});if($('#addorg'))$('#addorg').onclick=()=>openOrg({id:'org'+Date.now(),name:'',rate:25,start:'09:00',end:'17:00',breaks:30,weekStart:0,workdays:[0,1,2,3,4],auto:false,pay:'Weekly'},true)}else{$('#view').innerHTML=`<h1 class="title">Settings</h1><div class="card"><div class="between"><div><b>Your profile</b><div class="small muted">${esc(profile.name)}</div></div><button class="btn" id="editprofile">Edit</button></div><hr style="border:0;border-top:1px solid #e4ebe5;margin:15px 0"><div class="between"><b>Appearance</b><button class="btn" id="settingtheme">${dark?'☾ Dark':'☀ Light'}</button></div><p class="small muted">Currency: AUD · Workplaces: ${orgs.length} of 3</p></div><p class="small muted">Standalone design reference. No login, database, background sync or push notifications.</p>`;$('#editprofile').onclick=openProfile;$('#settingtheme').onclick=toggleTheme}}function toggleTheme(){dark=!dark;render()}$('#theme').onclick=toggleTheme;$('#profile').onclick=openProfile;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;offset=0;render()});function showModal(html){$('#modal').innerHTML=html;$('#overlay').classList.remove('hidden');$('#closemodal').onclick=closeModal}function closeModal(){$('#overlay').classList.add('hidden');editing=null}$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function input(label,id,value,type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function openOrg(o,isNew=false){editing={type:'org',id:o.id,isNew};let draft=structuredClone(o);const draw=()=>{showModal(`<div class="between"><h2>${isNew?'New workplace':'Edit workplace'}</h2><button class="btn" id="closemodal">✕</button></div>${input('Organisation name','oname',draft.name)}<div class="fields2">${input('Hourly rate ($)','orate',draft.rate,'number')}<div class="field"><label>Pay cycle</label><select id="opay">${['Weekly','Fortnightly','Monthly'].map(v=>`<option ${v===draft.pay?'selected':''}>${v}</option>`).join('')}</select></div>${input('Default start','ostart',draft.start,'time')}${input('Default end','oend',draft.end,'time')}</div>${input('Unpaid break (minutes)','obreak',draft.breaks,'number')}<div class="field"><label>Scheduled working days</label><div class="weekdays">${DAYS.map((d,i)=>`<button class="weekday ${draft.workdays.includes(i)?'active':''}" data-day="${i}">${d.slice(0,2)}</button>`).join('')}</div></div><div class="field"><label>Workweek starts on</label><select id="oweek">${DAYS.map((d,i)=>`<option value="${i}" ${i===draft.weekStart?'selected':''}>${d}</option>`).join('')}</select></div><label class="toggle"><span><b>Automatic logging</b><br><span class="small muted">Log scheduled shifts after they end</span></span><input id="oauto" type="checkbox" ${draft.auto?'checked':''}></label><div class="spacer"></div><div id="err" class="error"></div><button class="btn primary" id="saveorg">Save workplace</button>`);const capture=()=>{draft={...draft,name:$('#oname').value,rate:$('#orate').value,start:$('#ostart').value,end:$('#oend').value,breaks:$('#obreak').value,pay:$('#opay').value,weekStart:+$('#oweek').value,auto:$('#oauto').checked}};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{capture();const i=+b.dataset.day;draft.workdays=draft.workdays.includes(i)?draft.workdays.filter(x=>x!==i):[...draft.workdays,i];draw()});$('#saveorg').onclick=()=>{capture();if(!draft.name.trim())return $('#err').textContent='Enter an organisation name.';if(draft.rate===''||!Number.isFinite(+draft.rate)||+draft.rate<0)return $('#err').textContent='Enter a valid hourly rate.';if(duration(draft.start,draft.end,draft.breaks)===null)return $('#err').textContent='Enter valid shift times and break.';if(!draft.workdays.length)return $('#err').textContent='Select at least one workday.';draft.rate=+draft.rate;draft.breaks=+draft.breaks;if(isNew){if(orgs.length>=3)return $('#err').textContent='Maximum three workplaces.';orgs.push(draft);selected=draft.id}else orgs=orgs.map(x=>x.id===draft.id?draft:x);closeModal();render()}};draw()}function openShift(date){const o=org(),s=shift(o,date)||{start:o.start,end:o.end,breaks:o.breaks,hours:0,status:'manual'};showModal(`<div class="between"><h2>Edit shift</h2><button class="btn" id="closemodal">✕</button></div><p class="small muted">${date.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${esc(o.name)}</p><div class="fields2">${input('Start time','sstart',s.start,'time')}${input('End time','send',s.end,'time')}</div>${input('Unpaid break (minutes)','sbreak',s.breaks,'number')}<p class="small muted">Saving creates a manual entry, overriding auto-set shifts.</p><div class="error" id="err"></div><button class="btn primary" id="saveshift">✓ Save manual shift</button><div style="height:8px"></div><button class="btn" style="width:100%" id="dayoff">Mark as day off</button><div style="height:8px"></div><button class="btn" style="width:100%" id="resetshift">Reset to organisation schedule</button>`);const k=o.id+':'+key(date);$('#saveshift').onclick=()=>{const start=$('#sstart').value,end=$('#send').value,breaks=+$('#sbreak').value,hours=duration(start,end,breaks);if(hours===null)return $('#err').textContent='Check start, end and break.';entries[k]={start,end,breaks,hours,status:'manual'};closeModal();render()};$('#dayoff').onclick=()=>{entries[k]={status:'off',hours:0};closeModal();render()};$('#resetshift').onclick=()=>{delete entries[k];closeModal();render()}}function openProfile(){showModal(`<div class="between"><h2>Edit profile</h2><button class="btn" id="closemodal">✕</button></div>${input('Full name','pname',profile.name)}${input('Phone','pphone',profile.phone,'tel')}${input('Email','pemail',profile.email,'email')}<div class="error" id="err"></div><button class="btn primary" id="saveprofile">Save profile</button>`);$('#saveprofile').onclick=()=>{if(!$('#pname').value.trim())return $('#err').textContent='Name is required.';profile={name:$('#pname').value.trim(),phone:$('#pphone').value,email:$('#pemail').value};closeModal();render()}}render();
</script></body></html>
