# Replace hourly.example.com and obtain certificates before enabling this file.
server {
    listen 80;
    server_name hourly.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name hourly.example.com;
    ssl_certificate /etc/letsencrypt/live/hourly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hourly.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
