x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://hourly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/hourly
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hourly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hourly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hourly -d hourly"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      retries: 3
  scheduler:
    <<: *app
    command: [flask, --app, wsgi, scheduler]
    depends_on:
      migrate:
        condition: service_completed_successfully
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: hourly
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: hourly_test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hourly -d hourly_test"]
      interval: 3s
      retries: 20
  tests:
    build: .
    profiles: [test]
    user: root
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://hourly:test-only@test-db:5432/hourly_test
      SECRET_KEY: test-secret-not-for-production-1234567890
      COOKIE_SECURE: "0"
    depends_on:
      test-db:
        condition: service_healthy
    command: [sh, -c, "pip install -r requirements-dev.txt && pytest -q"]
volumes:
  pgdata:
