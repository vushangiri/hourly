name: test
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hourly
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hourly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hourly -d hourly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hourly:test-only@localhost:5432/hourly_test
      TEST_DATABASE_URL: postgresql+psycopg://hourly:test-only@localhost:5432/hourly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q
